name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: oxlint
        run: npx oxlint --deny-warnings
      - name: tsc
        run: npm run typecheck
      - name: vitest
        run: npm test
      - name: build
        run: npx vite build
      - name: size budget
        run: npm run size
      - name: build (subpath /earforge/)
        run: npx vite build --outDir dist-subpath
        env:
          BASE_PATH: /earforge/

  e2e:
    name: e2e (puppeteer + Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Run e2e suite
        run: npm run e2e -- --jobs 2 --retries 1
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: |
            e2e-output
            !e2e-output/dist
          retention-days: 14
